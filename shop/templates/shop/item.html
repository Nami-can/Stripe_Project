<html>
<head>
    <title>{{ item.name }}</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { background: #5469d4; color: white; border: none; padding: 15px 30px; 
                 font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; }
        .price { font-size: 32px; color: #2c3e50; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>{{ item.name }}</h1>
    <p>{{ item.description }}</p>
    <div class="price">{{ item.price }} {{ item.currency|upper }}</div>
    
    <button id="buy-button">Купить</button>
    
    <script>
        const stripe = Stripe('{{ stripe_public_key }}');
        document.getElementById('buy-button').addEventListener('click', async () => {
            const response = await fetch('/buy/{{ item.id }}/');
            const session = await response.json();
            if (session.error) { alert(session.error); return; }
            const result = await stripe.redirectToCheckout({ sessionId: session.id });
            if (result.error) alert(result.error.message);
        });
    </script>
</body>
</html>
